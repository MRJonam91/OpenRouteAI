name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -p no:cacheprovider
      - name: Keep the core under 1,500 lines
        run: |
          lines=$(find src/openrouteai -name '*.py' -exec cat {} + | wc -l)
          echo "Production Python lines: $lines"
          test "$lines" -lt 1500
