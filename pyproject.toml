[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouteai"
version = "0.1.0a1"
description = "Local AI gateway for Ollama and OpenAI-compatible servers"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "MRJonam91"}]
keywords = ["ai-gateway", "ollama", "openai-compatible", "local-first", "privacy-first"]
dependencies = ["fastapi>=0.110,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "openai>=1,<3"]

[project.scripts]
openrouteai = "openrouteai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.openrouteai]
release_fingerprint = "58ab9c0baefd49dc82facc438a7001ea"
